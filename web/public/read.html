<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Feed</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2016%2016%27%3E%3Cpolygon%20points%3D%275,3%2013,8%205,13%27%20fill%3D%27%236366f1%27/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="read.css" />
</head>
<body class="read-body">

  <header class="read-header">
    <div class="read-header-inner">
      <div class="brand">
        <span class="brand-mark">▸</span>
        <span class="brand-name">Daily Feed</span>
        <span class="brand-date" id="feedDate">—</span>
      </div>
      <div class="read-controls">
        <div class="date-wrap">
          <svg class="date-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
            <rect x="1" y="3" width="14" height="12" rx="1.5"/>
            <path d="M1 7h14M5 1v4M11 1v4"/>
          </svg>
          <select id="datePicker" title="Browse archive">
            <option value="">Today</option>
          </select>
        </div>
        <a class="read-link" href="/dashboard">Dashboard →</a>
      </div>
    </div>
  </header>

  <nav class="jump-nav" id="jumpNav" hidden>
    <div class="jump-nav-inner" id="jumpNavInner"></div>
  </nav>

  <main class="read-main">
    <div class="loading-state" id="loadingState">
      <div class="spinner"></div>
      <p>Loading feed…</p>
    </div>
    <div class="error-state hidden" id="errorState">
      <div class="error-icon">⚠</div>
      <p id="errorMessage">No feed yet — run <code>/refresh</code> to generate today's feed.</p>
    </div>
    <article class="read-article" id="feed"></article>
  </main>

  <footer class="read-footer">
    <span>Daily Feed</span>
    <span class="footer-sep">·</span>
    <span id="footerItemCount">0 items</span>
    <span class="footer-sep">·</span>
    <a class="read-link" id="rawLink" href="/api/feed.md">View raw markdown</a>
  </footer>

  <script src="read.js"></script>
</body>
</html>
